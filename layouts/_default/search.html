{{ define "main" }}
<main id="main">
  <div class="article-box">
    <header class="list-head card">
      <h1 class="list-title">
        <svg class="icon icon-xs" aria-hidden="true"><use href="#i-search"></use></svg>
        搜索
      </h1>
      {{- with partial "page-body.html" $ }}<div class="list-desc">{{ . | plainify }}</div>{{ end }}
    </header>

    <form class="search-form" id="search-form" role="search" action="{{ .RelPermalink }}" method="get">
      <label class="sr-only" for="search-input">搜索关键词</label>
      <input class="search-input" type="search" id="search-input" name="q"
             placeholder="输入关键词，多个用空格分隔…" autocomplete="off" spellcheck="false">
      <button class="search-submit" type="submit">搜索</button>
    </form>

    <p class="search-status" id="search-status" role="status" aria-live="polite"></p>

    <div class="article-list" id="search-results"></div>
  </div>

  {{ partial "sidebar.html" . }}
</main>
{{ end }}

{{ define "scripts" }}
{{- $search := resources.Get "js/search.js" | minify | fingerprint }}
<script defer src="{{ $search.RelPermalink }}" integrity="{{ $search.Data.Integrity }}"></script>
{{ end }}
