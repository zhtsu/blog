{{- /* 取出「真正有内容」的页面正文。
       为什么需要它：Hugo 的 .Content 只要不是空字符串就算非空，
       而 content/*.md 里只写一行 HTML 注释时，.Content 就是
       "<!-- ... -->"——模板会照样渲染出外层卡片，
       结果是一个只有 padding 的空白条。
       这里先把注释剥掉再判断。参数：page */ -}}
{{- $c := .Content -}}
{{- $c = replaceRE `(?s)<!--.*?-->` "" $c -}}
{{- return (trim $c " \n\r\t") -}}
