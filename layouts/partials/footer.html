{{- $since := site.Params.footer.since | default 2020 -}}
{{- $now := now.Year -}}
{{- $author := site.Params.author | default site.Title -}}
<footer id="footer">
  <div class="footer-inner">
    <p class="footer-text">
      <small>Copyright &copy; {{ if lt (int $since) $now }}{{ $since }}&ndash;{{ $now }}{{ else }}{{ $now }}{{ end }} <strong>{{ $author }}</strong></small>
    </p>
  </div>
</footer>
