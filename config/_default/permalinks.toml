# ============================================================
#  URL 规则
#  沿用 main 分支原有的 permalinks 约定，保证线上已收录的链接不失效。
#  注意：Hugo 0.108 只认这种扁平写法（post = "/p/:slug/"）。
#  写成 [post] permalink = "..." 会让 Hugo 直接 panic（slice bounds out of range）。
# ============================================================

# 文章：/p/文章目录名/
post = "/p/:slug/"

# 独立页面（关于等）
page = "/:slug/"
