# ============================================================
#  站点基础配置
# ============================================================

baseURL = "https://blog.zhtsu.cc/"
title = "zhtsu"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"

# 中文内容必须开启，否则 .Summary / .WordCount 对 CJK 判断失准
hasCJKLanguage = true

# 分页：文章列表每页条数
paginate = 8

# 生成摘要，供列表卡片使用
summaryLength = 80

[taxonomies]
  tag = "tags"
  category = "categories"

# 输出格式定义：供前端全文检索使用的 JSON 索引 -> /search.json
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

# 只输出 HTML 与搜索索引，不生成 RSS（/index.xml）
[outputs]
  home = ["HTML", "SearchIndex"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
