# ============================================================
#  模板参数 —— 全部可改，模板里通过 site.Params.* 读取
# ============================================================

# 站点副标题，显示在页头 logo 下方
subtitle = ""

# 浏览器标签页 / 卡片图标
favicon = "/favicon.png"

# 首页每页文章数
pagerSize = 8

# 文章正文页显示 "本文共 N 字"
showWordCount = true
# 文章正文页显示预计阅读时间
showReadingTime = true
# 文章正文页显示目录
showTOC = true
# 目录默认是否展开
tocOpen = false

# 文章卡片是否显示摘要
showSummary = true
# 文章卡片是否显示封面图
showCover = true

# 页脚
[footer]
  since = 2020
  customText = ""

# 日期显示格式（Hugo 使用 Go 的时间布局）
[dateFormat]
  published = "2006年01月02日"
  list = "2006-01-02"

# ---- 导航菜单 ----
# 只留三项。文章列表与标签已经在首页卡片和右侧栏都能进，
# 顶栏再放一遍属于重复入口（原本还挤掉了搜索框的宽度）。
[[main]]
  name = "主页"
  url = "/"
  weight = 10

[[main]]
  name = "归档"
  url = "/archives/"
  section = "archives"
  weight = 20

[[main]]
  name = "关于"
  url = "/about/"
  weight = 30

# ---- 顶栏右侧下拉 ----
# 已移除：原来照抄了原站 Bootstrap 的「其他」下拉，交互只是默认态。
# 需要外链入口的话放侧栏 links，或直接加进上面的 [[main]]。

# ---- 侧栏：友情链接（沿用 main 的 content/page/links）----
[[links]]
  name = "GOOBLOG"
  url = "https://www.blog.googookuki.cn/#/home"

# ---- 侧栏：其它外链（原本是顶栏「其他」下拉，下拉去掉后移到这里）----
[[socials]]
  name = "GitHub"
  url = "https://github.com/zhtsu"

[[socials]]
  name = "Gitee"
  url = "https://gitee.com/zhtsu"

[[socials]]
  name = "CSDN"
  url = "https://blog.csdn.net/weixin_45711556"

[[socials]]
  name = "Bilibili"
  url = "https://space.bilibili.com/456214277"

# ---- 暗色模式 ----
[darkMode]
  enabled = true
  # auto | light | dark
  default = "auto"
  # 显示切换按钮
  toggle = true
