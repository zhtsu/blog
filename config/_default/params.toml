# ============================================================
#  模板参数 —— 全部可改，模板里通过 site.Params.* 读取
# ============================================================

# 站点副标题，显示在页头 logo 下方
subtitle = ""

# 浏览器标签页 / 卡片图标
favicon = "/favicon.png"

# 首页每页文章数
pagerSize = 8

# 文章正文页显示 "本文共 N 字"
showWordCount = true
# 文章正文页显示预计阅读时间
showReadingTime = true
# 文章正文页显示目录
showTOC = true
# 目录默认是否展开
tocOpen = false

# 文章卡片是否显示摘要
showSummary = true
# 文章卡片是否显示封面图
showCover = true

# 页脚
[footer]
  since = 2020
  customText = ""
  # 显示「Powered by Hugo + 版本号」，置 false 可关掉
  showHugo = true

# 日期显示格式（Hugo 使用 Go 的时间布局）
[dateFormat]
  published = "2006年01月02日"
  list = "2006-01-02"

# ---- 导航菜单 ----
# 首页入口由左上角的站点名（Logo）承担，不必再占一个菜单项。
# 目前只留「归档」，在顶栏靠右显示。
[[main]]
  name = "归档"
  url = "/archives/"
  section = "archives"
  weight = 10

# ---- 顶栏右侧下拉 ----
# 已移除：原来照抄了原站 Bootstrap 的「其他」下拉，交互只是默认态。
# 需要外链入口的话放侧栏 links，或直接加进上面的 [[main]]。

# ---- 侧栏：友情链接 ----
# 侧栏的「友情链接」卡片已按要求移除，数据先留在这里。
# 想恢复：在 partials/sidebar.html 末尾加回一张卡片并 range site.Params.links。
[[links]]
  name = "GOOBLOG"
  url = "https://www.blog.googookuki.cn/#/home"

# ---- 侧栏：推荐文章 ----
# 用标签驱动：给文章 front matter 的 tags 加上下面这个标签名，
# 它就会进侧栏的「推荐文章」卡片（按日期倒序，最多 5 条）。
# 一篇都没打该标签时，卡片回落显示「最新文章」。
[recommend]
  tag = "推荐文章"

# ---- 评论 ----
# Hugo 本身没有评论能力，这里是在文章页嵌入第三方组件。
# 只实现 giscus（基于 GitHub Discussions）：评论存在自己的仓库里，
# 不需要数据库与服务器，零维护成本。
#
# 启用步骤：
#   1. 仓库 Settings → Features 勾选 Discussions
#   2. 安装 https://github.com/apps/giscus ，只授权本仓库
#   3. 到 https://giscus.app/zh-CN 填仓库名，复制生成的
#      data-repo-id / data-category-id 填到下面，再把 enabled 改为 true
#
# repoID / categoryID 为空时模板不输出评论区，页面上不会出现空白框。
# 单篇文章可在 front matter 用 comments: false 单独关闭。
[comments]
  enabled = false
  provider = "giscus"

  [comments.giscus]
    # 仓库名，形如 用户名/仓库名
    repo = "zhtsu/blog"
    # 从 giscus.app 生成，形如 R_kgDOxxxxxx
    repoID = ""
    # Discussion 分类名，建议选只有维护者能发起讨论的分类
    category = "Announcements"
    # 从 giscus.app 生成，形如 DIC_kwDOxxxxxx
    categoryID = ""
    # 页面与 discussion 的映射方式：pathname | url | title | og:title
    mapping = "pathname"
    # "1" = 严格匹配映射值
    strict = "1"
    # 是否显示表情回应
    reactionsEnabled = "1"
    # 输入框位置：top | bottom
    inputPosition = "top"
    # 界面语言
    lang = "zh-CN"
    # 浅色 / 深色主题，深色由 assets/js/comments.js 动态切换
    lightTheme = "light"
    darkTheme = "dark"

# ---- 暗色模式 ----
[darkMode]
  enabled = true
  # auto | light | dark
  default = "auto"
  # 显示切换按钮
  toggle = true
