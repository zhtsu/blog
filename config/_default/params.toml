# ============================================================
#  模板参数 —— 全部可改，模板里通过 site.Params.* 读取
# ============================================================

# 站点副标题，显示在页头 logo 下方
subtitle = ""

# 浏览器标签页 / 卡片图标
favicon = "/favicon.png"

# 首页每页文章数
pagerSize = 8

# 文章正文页显示 "本文共 N 字"
showWordCount = true
# 文章正文页显示预计阅读时间
showReadingTime = true
# 文章正文页显示目录
showTOC = true
# 目录默认是否展开
tocOpen = false

# 文章卡片是否显示摘要
showSummary = true
# 文章卡片是否显示封面图
showCover = true

# 页脚
[footer]
  since = 2020
  customText = ""

# 日期显示格式（Hugo 使用 Go 的时间布局）
[dateFormat]
  published = "2006年01月02日"
  list = "2006-01-02"

# ---- 导航菜单 ----
[[main]]
  name = "主页"
  url = "/"
  weight = 10

[[main]]
  name = "文章"
  url = "/post/"
  weight = 20

[[main]]
  name = "标签"
  url = "/tags/"
  weight = 30

[[main]]
  name = "归档"
  url = "/archives/"
  weight = 40

[[main]]
  name = "关于"
  url = "/about/"
  weight = 50

# ---- 顶栏右侧下拉 ----
[[dropdown]]
  name = "CSDN"
  url = "https://blog.csdn.net/weixin_45711556"

[[dropdown]]
  name = "Gitee"
  url = "https://gitee.com/zhtsu"

[[dropdown]]
  name = "GitHub"
  url = "https://github.com/zhtsu"

# ---- 侧栏：友情链接（沿用 main 的 content/page/links）----
[[links]]
  name = "GOOBLOG"
  url = "https://www.blog.googookuki.cn/#/home"

# ---- 侧栏：个人卡片 ----
[profile]
  enabled = true
  title = "关于我"
  # 头像：留空则显示内置图标占位
  avatar = ""
  bio = ""

# ---- 看板娘（Live2D）----
[live2d]
  enabled = true
  # 小于该宽度不加载看板娘
  minWidth = 768
  # 是否使用本地 vendor 的资源（static/live2d/），false 则走 CDN
  local = true
  # CDN 兜底地址
  cdnPath = "https://cdn.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/"
  # 模型 API
  modelApi = "https://cdn.jsdelivr.net/gh/fghrss/live2d_api/"

# ---- 暗色模式 ----
[darkMode]
  enabled = true
  # auto | light | dark
  default = "auto"
  # 显示切换按钮
  toggle = true
